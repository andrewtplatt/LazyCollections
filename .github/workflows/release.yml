name: Publish NuGet Package on Release

on:
  workflow_dispatch:
  release:
    types:
      - published

env:
  NuGetDirectory: ${{ github.workspace }}/nuget
jobs:
  build-and-publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x.x
            9.x.x
            10.x.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
      

      - name: Extract version from tag
        id: version
        run: |
          # Strip the leading 'v' prefix: v1.2.3 -> 1.2.3
          RELEASE_NAME="${{ github.event.release.name }}"
          VERSION="${RELEASE_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Packaging version: $VERSION"
      - name: Pack
        run: dotnet pack --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} --output ${{ env.NuGetDirectory }}
      
      # Get a short-lived NuGet API key
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        run: |
          ls -la ${{ env.NuGetDirectory }}
          for pkg in ${{ env.NuGetDirectory }}/Plattipus.*.nupkg; do
            if [ -f "$pkg" ]; then
              dotnet nuget push "$pkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
